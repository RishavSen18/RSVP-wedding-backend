# ===================================================================
# Test Profile Configuration (H2 In-Memory with PostgreSQL Mode)
# ===================================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Flyway during unit tests using H2 create-drop
spring.flyway.enabled=false

# Test CORS
app.cors.allowed-origins=http://localhost:5173
