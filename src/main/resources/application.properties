# ===================================================================
# Wedding RSVP Spring Boot REST API Configuration
# ===================================================================

# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=wedding-rsvp-api

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wedding_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# Using Flyway for schema management, so Hibernate validation only
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# CORS Configuration
# Configurable allowed origins for React Wedding Website & Response Viewer
# Default to common React Vite dev server port http://localhost:5173
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
